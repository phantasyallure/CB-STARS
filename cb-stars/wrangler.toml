name = "cb-star"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

main = "./dist/_worker.js/index.js"

# Plain-text variables added in the Cloudflare dashboard would otherwise be wiped by every
# `wrangler deploy` (the Workers Builds deploy step). Secrets are never wiped.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Product photos live in Cloudflare R2. Create the bucket first (R2 > Create bucket), same name as below.
# Also add the variable R2_PUBLIC_URL (public address of the bucket, e.g. https://img.cbstars.store)
# under Settings > Variables and Secrets.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "cbstars-images"
