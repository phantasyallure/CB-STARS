name = "cb-star"
compatibility_date = "2026-09-01"
# "nodejs_compat" polyfills Node globals (Buffer, process, etc.) that the
# functions in /functions/api use.
compatibility_flags = ["nodejs_compat"]

# /functions/api/**.js gets compiled into this single Worker script by the
# "build:cf" script in package.json (via `wrangler pages functions build`).
# This is required on Cloudflare's unified Workers platform — a plain
# `wrangler deploy` does NOT auto-detect a /functions folder the way the old
# standalone Cloudflare Pages product used to.
main = "./dist/_worker.js/index.js"

# The Vite build's static output. (main MUST come before this [assets] table
# in this file — TOML attaches any key after a [table] header to that table,
# so "main" placed below [assets] silently becomes assets.main instead of a
# top-level key. Wrangler will error "Cannot use assets with a binding in an
# assets-only Worker" if that happens.)
[assets]
directory = "./dist"
binding = "ASSETS"
