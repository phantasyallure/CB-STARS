<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CB Stars — Vêtements et chaussures</title>
    <meta name="description" content="CB Stars — vêtements et chaussures sélectionnés, livrés partout en Algérie." />
    <meta name="theme-color" content="#6e1423" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var lang = window.localStorage.getItem('cbstars_lang');
          if (lang !== 'en' && lang !== 'ar') lang = 'fr';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
